<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--navy-950:#0f172a;--navy-900:#172554;--navy-700:#1e40af;
--slate-800:#1e293b;--slate-700:#334155;--slate-600:#475569;--slate-500:#64748b;--slate-400:#94a3b8;--slate-300:#cbd5e1;--slate-200:#e5e7eb;--slate-100:#f1f5f9;--slate-50:#f8fafc;
--emerald-bg:#ecfdf5;--emerald-text:#065f46;--emerald-border:#a7f3d0;
--amber-bg:#fffbeb;--amber-text:#92400e;--amber-border:#fde68a;
--ruby-bg:#fef2f2;--ruby-text:#991b1b;--ruby-border:#fecaca;
--info-bg:#eff6ff;--info-text:#1e40af;--info-border:#bfdbfe;
--response-bg:#fffde7;
--font-display:'Playfair Display',Georgia,serif;
--font-body:'DM Sans',system-ui,sans-serif;
--font-mono:'DM Mono','Courier New',monospace;
}
html{font-size:16px}
body{font-family:var(--font-body);background:var(--slate-100);color:var(--slate-800);min-height:100vh}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}
textarea{resize:vertical}
.app-header{background:var(--navy-950);color:#fff;padding:28px 32px 0}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.brand-label{font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--slate-500);margin-bottom:6px}
.brand-title{font-size:28px;font-weight:800;font-family:var(--font-display);letter-spacing:-0.02em;line-height:1.1}
.brand-sub{font-size:13px;color:var(--slate-400);margin-top:4px;font-style:italic}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,0.1);transition:all 0.15s}
.btn-ghost{background:rgba(255,255,255,0.06);color:#fff}.btn-ghost:hover{background:rgba(255,255,255,0.12)}
.btn-primary{background:var(--navy-700);color:#fff;border-color:var(--navy-700)}.btn-primary:hover{background:#2563eb}
.btn-danger{background:rgba(239,68,68,0.12);color:#fca5a5;border-color:rgba(239,68,68,0.2)}.btn-danger:hover{background:rgba(239,68,68,0.25)}
.save-indicator{font-size:11px;color:var(--slate-500);padding:8px 0;display:flex;align-items:center;gap:6px}
.save-dot{width:6px;height:6px;border-radius:50%;background:#22c55e}
.save-dot.saving{background:#f59e0b;animation:pulse 0.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:16px}
.meta-field{flex:1;min-width:140px}
.meta-label{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--slate-500);display:block;margin-bottom:3px}
.meta-input{width:100%;padding:7px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#fff;font-size:13px;outline:none}
.meta-input:focus{border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.08)}
.meta-input::placeholder{color:var(--slate-500)}
.phase-tabs{display:flex;gap:2px}
.phase-tab{flex:1;padding:14px 12px 12px;background:transparent;color:var(--slate-400);border:none;border-radius:10px 10px 0 0;text-align:center;transition:all 0.2s}
.phase-tab:hover{background:rgba(255,255,255,0.04)}
.phase-tab.active{color:#fff}
.ph-num{font-size:10px;font-weight:700;letter-spacing:0.1em;opacity:0.5;margin-bottom:2px}
.ph-name{font-size:14px;font-weight:600;margin-bottom:6px}
.ph-pct{font-size:10px;margin-top:4px;opacity:0.7;font-family:var(--font-mono)}
.progress-track{width:100%;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width 0.6s cubic-bezier(0.4,0,0.2,1)}
.main-container{max-width:1200px;margin:0 auto;padding:24px}
.workspace{display:flex;gap:24px}
.sidebar{width:220px;flex-shrink:0}
.sidebar-sticky{position:sticky;top:24px}
.sidebar-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--slate-400);margin-bottom:8px;padding-left:14px}
.sec-btn{display:block;width:100%;padding:10px 14px;border-radius:8px;background:transparent;border:none;text-align:left;transition:all 0.15s;margin-bottom:2px}
.sec-btn:hover{background:var(--slate-50)}
.sec-btn.active{background:var(--slate-200)}
.sec-title{font-size:13px;font-weight:400;color:var(--slate-500)}
.sec-btn.active .sec-title{font-weight:600;color:var(--slate-800)}
.sec-prog{display:flex;align-items:center;gap:6px;margin-top:4px}
.sec-prog .progress-track{background:var(--slate-200);height:3px}
.sec-count{font-size:10px;color:var(--slate-400);font-family:var(--font-mono);white-space:nowrap}
.content{flex:1;min-width:0}
.section-header{margin-bottom:20px}
.section-phase-badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px}
.section-title{font-size:24px;font-weight:700;color:var(--slate-800);font-family:var(--font-display);margin-bottom:4px}
.section-sub{font-size:14px;color:var(--slate-500);font-style:italic}
.q-card{background:#fff;border-radius:12px;border:1px solid var(--slate-200);padding:20px 24px;margin-bottom:12px;transition:box-shadow 0.2s}
.q-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.04)}
.q-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:12px}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.q-theme{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0.6}
.q-sep{font-size:10px;color:var(--slate-400)}
.q-topic{font-size:11px;font-weight:600;color:var(--slate-600)}
.q-text{font-size:15px;font-weight:500;color:var(--slate-800);line-height:1.45}
.status-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;border:1px solid;white-space:nowrap;transition:all 0.15s}
.status-badge:hover{filter:brightness(0.95)}
.st-not-started{background:var(--ruby-bg);color:var(--ruby-text);border-color:var(--ruby-border)}
.st-in-progress{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-border)}
.st-complete{background:var(--emerald-bg);color:var(--emerald-text);border-color:var(--emerald-border)}
.st-needs-review{background:var(--info-bg);color:var(--info-text);border-color:var(--info-border)}
.q-textarea{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--slate-200);font-size:14px;line-height:1.6;color:var(--slate-800);background:var(--response-bg);outline:none;transition:border-color 0.2s;min-height:80px}
.q-textarea:focus{border-color:var(--navy-700)}
.q-textarea::placeholder{color:var(--slate-400)}
.tip-toggle{margin-top:8px;font-size:12px;background:none;border:none;padding:0;opacity:0.7;transition:opacity 0.15s}
.tip-toggle:hover{opacity:1}
.tip-box{margin-top:8px;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;border-left:3px solid}
.dash-metrics{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.metric-card{background:var(--slate-50);border-radius:10px;padding:16px 18px;flex:1;min-width:120px}
.metric-label{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--slate-400);margin-bottom:4px}
.metric-val{font-size:28px;font-weight:700;color:var(--slate-800);font-family:var(--font-mono);line-height:1}
.metric-sub{font-size:11px;color:var(--slate-500);margin-top:4px}
.dash-phases{display:flex;gap:6px;margin-bottom:24px}
.dash-phase{flex:1;padding:10px 12px;border-radius:8px;text-align:center}
.dash-phase-name{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px}
.dash-phase-count{font-size:11px;margin-top:4px;font-family:var(--font-mono)}
.dash-table{background:#fff;border-radius:12px;border:1px solid var(--slate-200);overflow:hidden}
.dash-table-header{padding:16px 20px;border-bottom:1px solid var(--slate-200);background:var(--slate-50)}
.dash-table-header h3{font-size:15px;font-weight:600;color:var(--slate-800)}
.dash-row{padding:12px 20px;border-bottom:1px solid var(--slate-100);display:flex;align-items:center;gap:16px}
.dash-row:last-child{border-bottom:none}
.dash-dot{width:6px;height:6px;border-radius:3px;flex-shrink:0}
.dash-row-info{flex:1;min-width:0}
.dash-row-title{font-size:13px;font-weight:500;color:var(--slate-800)}
.dash-row-sub{font-size:11px;color:var(--slate-400)}
.dash-row-bar{width:100px}
.dash-row-count{font-size:11px;font-family:var(--font-mono);color:var(--slate-500);min-width:50px;text-align:right}
.dash-row-ans{font-size:11px;color:var(--slate-400);min-width:70px;text-align:right}
.projects-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;background:var(--navy-950);color:#fff}
.projects-logo{font-family:var(--font-display);font-size:42px;font-weight:800;margin-bottom:4px;letter-spacing:-0.02em}
.projects-sub{font-size:14px;color:var(--slate-400);font-style:italic;margin-bottom:12px}
.projects-path{font-size:11px;color:var(--slate-600);font-family:var(--font-mono);margin-bottom:32px;padding:6px 14px;background:rgba(255,255,255,0.03);border-radius:6px;border:1px solid rgba(255,255,255,0.06)}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;width:100%;max-width:900px;margin-bottom:24px}
.project-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px;cursor:pointer;transition:all 0.2s}
.project-card:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15);transform:translateY(-2px)}
.project-card-name{font-size:16px;font-weight:600;margin-bottom:4px}
.project-card-meta{font-size:12px;color:var(--slate-400);margin-bottom:12px}
.project-card-progress{display:flex;align-items:center;gap:8px}
.project-card .progress-track{background:rgba(255,255,255,0.1);height:4px;flex:1}
.project-card .progress-fill{background:var(--slate-400)}
.project-card-pct{font-size:12px;font-family:var(--font-mono);color:var(--slate-400)}
.project-card-actions{display:flex;gap:6px;margin-top:12px}
.project-card-actions button{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:500;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:var(--slate-400);transition:all 0.15s}
.project-card-actions button:hover{background:rgba(255,255,255,0.1);color:#fff}
.project-card-actions .del-btn:hover{background:rgba(239,68,68,0.2);color:#fca5a5;border-color:rgba(239,68,68,0.3)}
.new-project-card{background:transparent;border:2px dashed rgba(255,255,255,0.12);border-radius:12px;padding:20px;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:140px;color:var(--slate-500)}
.new-project-card:hover{border-color:rgba(255,255,255,0.3);color:#fff;background:rgba(255,255,255,0.02)}
.new-project-card .plus{font-size:28px;font-weight:300;margin-bottom:4px}
.new-project-card .np-label{font-size:13px;font-weight:500}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease-out both}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--navy-950);color:var(--slate-400);font-size:14px}
</style>
</head>

const SECTIONS=[
{id:"market",phase:"discovery",title:"Market & Business",subtitle:"Ground your AI product in real business context",questions:[

{id:"q14",theme:"User Value Map",topic:"AI Opportunities",q:"Which pain points can Generative AI address?",tip:"Problem, AI Solution concept, Expected Impact."}]},

const STATUSES=["not-started","in-progress","complete","needs-review"];
const STATUS_LABELS={"not-started":"Not started","in-progress":"In progress","complete":"Complete","needs-review":"Needs review"};
const STATUS_CSS={"not-started":"st-not-started","in-progress":"st-in-progress","complete":"st-complete","needs-review":"st-needs-review"};

function getPhase(id){return PHASES.find(p=>p.id===id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function pb(pct,color,h){h=h||3;return'<div class="progress-track" style="height:'+h+'px"><div class="progress-fill" style="width:'+Math.min(100,Math.max(0,pct))+'%;background:'+color+'"></div></div>';}

function calcStats(data){
const totalQ=SECTIONS.reduce((a,s)=>a+s.questions.length,0);
const completed=SECTIONS.reduce((a,s)=>a+s.questions.filter(q=>(data[q.id]?.status||"not-started")==="complete").length,0);
const inProg=SECTIONS.reduce((a,s)=>a+s.questions.filter(q=>data[q.id]?.status==="in-progress").length,0);
const answered=SECTIONS.reduce((a,s)=>a+s.questions.filter(q=>(data[q.id]?.response||"").trim().length>0).length,0);
return{totalQ,completed,inProg,answered,pct:totalQ>0?Math.round(completed/totalQ*100):0};
}

let S={screen:"projects",projects:[],pid:null,data:{},meta:{name:"",owner:"",industry:"",date:""},activePhase:"discovery",activeSection:"market",view:"workspace",openTips:{},saveTimer:null,saving:false};

async function api(path,opts){
const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opts});
return r.json();
}

async function loadProjects(){
S.projects=await api(API);
render();
}

async function openProject(pid){
const proj=await api(API+"/"+pid);
S.pid=pid;S.data=proj.data||{};S.meta=proj.meta||{name:"",owner:"",industry:"",date:""};
S.activePhase="discovery";S.activeSection="market";S.view="workspace";S.openTips={};S.screen="workspace";
render();
}

function updateSaveIndicator(){
const el=document.querySelector(".save-indicator");
if(!el)return;
el.innerHTML=`<div class="save-dot${S.saving?" saving":""}"></div>${S.saving?"Saving...":"All changes saved"}`;
}

async function saveProject(){
if(!S.pid)return;
S.saving=true;updateSaveIndicator();
await api(API+"/"+S.pid,{method:"PUT",body:JSON.stringify({meta:S.meta,data:S.data})});
S.saving=false;updateSaveIndicator();
}

function debounceSave(){
if(S.saveTimer)clearTimeout(S.saveTimer);
S.saving=true;updateSaveIndicator();
S.saveTimer=setTimeout(()=>saveProject(),600);
}

async function createProject(){
const name=prompt("Project name (becomes the filename):","New Client PRD");
if(!name)return;
const res=await api(API,{method:"POST",body:JSON.stringify({name,meta:{name,owner:"",industry:"",date:""}})});
await loadProjects();
openProject(res.id);
}

async function deleteProject(pid){
if(!confirm("Delete this project permanently?"))return;
await api(API+"/"+pid,{method:"DELETE"});
if(S.pid===pid){S.screen="projects";S.pid=null;}
await loadProjects();
}

async function duplicateProject(pid){
const proj=await api(API+"/"+pid);
const name=(proj.meta?.name||"Project")+" (copy)";
const res=await api(API,{method:"POST",body:JSON.stringify({name,meta:{...proj.meta,name}})});
await api(API+"/"+res.id,{method:"PUT",body:JSON.stringify({meta:{...proj.meta,name},data:proj.data||{}})});
await loadProjects();
}

function exportMarkdown(){
let md=`# AI Product Requirements Document\n## ${S.meta.name||"Untitled"}\n**Owner:** ${S.meta.owner||"\u2014"} | **Industry:** ${S.meta.industry||"\u2014"} | **Date:** ${S.meta.date||"\u2014"}\n\n---\n\n`;
PHASES.forEach(p=>{md+=`# ${p.icon}. ${p.label}\n\n`;SECTIONS.filter(s=>s.phase===p.id).forEach(s=>{md+=`## ${s.title}\n*${s.subtitle}*\n\n`;s.questions.forEach(q=>{const d=S.data[q.id]||{};md+=`### ${q.topic}\n**Status:** ${STATUS_LABELS[d.status||"not-started"]}\n\n**Q:** ${q.q}\n\n**A:** ${(d.response||"").trim()||"*No response yet*"}\n\n---\n\n`;});});});
const b=new Blob([md],{type:"text/markdown"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=((S.meta.name||"AI-PRD").replace(/\s+/g,"-"))+"_PRD.md";a.click();URL.revokeObjectURL(u);
}

function render(){document.getElementById("app").innerHTML=S.screen==="projects"?renderProjects():renderWorkspace();hookTextareaHeights();}

function hookTextareaHeights(){
document.querySelectorAll(".q-textarea").forEach(ta=>{
if(ta.value){ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";}
});
}

function renderProjects(){
let cards="";
S.projects.forEach(p=>{
const m=p.meta||{};const st=p.stats||{pct:0,completed:0,total:57,answered:0};
cards+=`<div class="project-card" onclick="window._open('${esc(p.id)}')">
<div class="project-card-name">${esc(m.name||p.id)}</div>
<div class="project-card-meta">${esc(m.owner||"No owner")} &middot; ${esc(m.industry||"No industry")} &middot; ${esc(m.date||"No date")}</div>
<div class="project-card-progress">${pb(st.pct,"#64748b",4)}<span class="project-card-pct">${st.pct}%</span></div>
<div class="project-card-actions">
<button onclick="event.stopPropagation();window._dup('${esc(p.id)}')">Duplicate</button>
<button class="del-btn" onclick="event.stopPropagation();window._del('${esc(p.id)}')">Delete</button>
</div></div>`;
});
return`<div class="projects-screen"><div class="projects-logo">Agentic PRD framework</div>
<div class="projects-sub">AI Product Requirements Framework</div>
<div class="projects-path">Projects saved to: ./projects/*.json</div>
<div class="projects-grid fade-in">${cards}
<div class="new-project-card" onclick="window._create()"><div class="plus">+</div><div class="np-label">New project</div></div>
</div></div>`;
}

function renderWorkspace(){
const phase=getPhase(S.activePhase);
const phaseSections=SECTIONS.filter(s=>s.phase===S.activePhase);
const cur=SECTIONS.find(s=>s.id===S.activeSection);

let tabs="";
PHASES.forEach(p=>{
const secs=SECTIONS.filter(s=>s.phase===p.id);
const t=secs.reduce((a,s)=>a+s.questions.length,0);
const d=secs.reduce((a,s)=>a+s.questions.filter(q=>(S.data[q.id]?.status||"not-started")==="complete").length,0);
const pct=t>0?Math.round(d/t*100):0;
const act=S.activePhase===p.id;
tabs+=`<button class="phase-tab${act?" active":""}" onclick="window._phase('${p.id}')" style="${act?"background:"+p.accent:""}">
<div class="ph-num">${p.icon}</div><div class="ph-name">${p.label}</div>
${pb(pct,act?"rgba(255,255,255,0.6)":p.accent,3)}<div class="ph-pct">${pct}%</div></button>`;
});

let mf="";
[{f:"name",l:"Product Name",ph:"e.g., Genesis"},{f:"owner",l:"Owner",ph:"Your name"},{f:"industry",l:"Industry",ph:"e.g., FinTech"},{f:"date",l:"Date",ph:"e.g., Q1 2026"}].forEach(x=>{
mf+=`<div class="meta-field"><label class="meta-label">${x.l}</label><input class="meta-input" value="${esc(S.meta[x.f]||"")}" placeholder="${x.ph}" oninput="window._meta('${x.f}',this.value)"></div>`;
});

let main="";
if(S.view==="dashboard"){main=renderDashboard();}
else{
let sb="";
phaseSections.forEach(s=>{
const t=s.questions.length;const d=s.questions.filter(q=>(S.data[q.id]?.status||"not-started")==="complete").length;
sb+=`<button class="sec-btn${S.activeSection===s.id?" active":""}" onclick="window._sec('${s.id}')">
<div class="sec-title">${s.title}</div><div class="sec-prog">${pb(t>0?d/t*100:0,phase.accent,3)}<span class="sec-count">${d}/${t}</span></div></button>`;
});
let qc="";
if(cur){cur.questions.forEach(q=>{
const qd=S.data[q.id]||{response:"",status:"not-started"};const st=qd.status||"not-started";const to=S.openTips[q.id];
qc+=`<div class="q-card"><div class="q-top"><div style="flex:1;min-width:0">
<div class="q-meta"><span class="q-theme" style="color:${phase.accent}">${q.theme}</span><span class="q-sep">/</span><span class="q-topic">${q.topic}</span></div>
<p class="q-text">${q.q}</p></div>
<button class="status-badge ${STATUS_CSS[st]}" onclick="window._status('${q.id}')">${STATUS_LABELS[st]}</button></div>
<textarea class="q-textarea" rows="3" placeholder="Enter your response..." oninput="window._resp('${q.id}',this.value);this.style.height='auto';this.style.height=this.scrollHeight+'px'" onfocus="this.style.borderColor='${phase.accent}'" onblur="this.style.borderColor='#e5e7eb'">${esc(qd.response||"")}</textarea>
<button class="tip-toggle" style="color:${phase.accent}" onclick="window._tip('${q.id}')">${to?"Hide guidance":"Show guidance"}</button>
${to?`<div class="tip-box" style="background:${phase.light};color:${phase.accent};border-color:${phase.accent}">${q.tip}</div>`:""}</div>`;
});}
main=`<div class="workspace fade-in"><div class="sidebar"><div class="sidebar-sticky"><div class="sidebar-label">Sections</div>${sb}</div></div>
<div class="content">${cur?`<div class="section-header"><div class="section-phase-badge" style="background:${phase.light};color:${phase.accent}">${phase.label}</div>
<h2 class="section-title">${cur.title}</h2><p class="section-sub">${cur.subtitle}</p></div>${qc}`:""}</div></div>`;
}

const saveInd=`<div class="save-indicator"><div class="save-dot${S.saving?" saving":""}"></div>${S.saving?"Saving...":"All changes saved"}</div>`;

return`<div class="app-header"><div class="header-top"><div>
<div class="brand-label">Agentic PRD Framework</div><h1 class="brand-title">AI Product Requirements</h1>
<p class="brand-sub">Discovery \u2192 Design \u2192 Develop \u2192 Deploy</p></div>
<div class="header-actions">${saveInd}
<button class="btn btn-ghost" onclick="window._back()">\u2190 Projects</button>
<button class="btn ${S.view==="dashboard"?"btn-primary":"btn-ghost"}" onclick="window._toggleView()">${S.view==="dashboard"?"Workspace":"Dashboard"}</button>
<button class="btn btn-ghost" onclick="window._exportMd()">Export .md</button>
</div></div><div class="meta-row">${mf}</div><div class="phase-tabs">${tabs}</div></div>
<div class="main-container">${main}</div>`;
}

function renderDashboard(){
const st=calcStats(S.data);
let pc="";PHASES.forEach(p=>{const secs=SECTIONS.filter(s=>s.phase===p.id);const t=secs.reduce((a,s)=>a+s.questions.length,0);const d=secs.reduce((a,s)=>a+s.questions.filter(q=>(S.data[q.id]?.status||"not-started")==="complete").length,0);
pc+=`<div class="dash-phase" style="background:${p.light}"><div class="dash-phase-name" style="color:${p.accent}">${p.label}</div>${pb(t>0?d/t*100:0,p.accent,4)}<div class="dash-phase-count" style="color:${p.accent}">${d}/${t}</div></div>`;});
let rows="";SECTIONS.forEach(s=>{const p=getPhase(s.phase);const t=s.questions.length;const d=s.questions.filter(q=>(S.data[q.id]?.status||"not-started")==="complete").length;const ans=s.questions.filter(q=>(S.data[q.id]?.response||"").trim()).length;
rows+=`<div class="dash-row"><div class="dash-dot" style="background:${d===t?"#10b981":d>0?"#f59e0b":"#e5e7eb"}"></div>
<div class="dash-row-info"><div class="dash-row-title">${s.title}</div><div class="dash-row-sub">${s.subtitle}</div></div>
<div class="dash-row-bar">${pb(t>0?d/t*100:0,p.accent,3)}</div><div class="dash-row-count">${d}/${t}</div><div class="dash-row-ans">${ans} answered</div></div>`;});
return`<div class="fade-in"><div class="dash-metrics">
<div class="metric-card"><div class="metric-label">Overall</div><div class="metric-val">${st.pct}%</div><div class="metric-sub">${st.completed}/${st.totalQ} complete</div></div>
<div class="metric-card"><div class="metric-label">Answered</div><div class="metric-val">${st.answered}</div><div class="metric-sub">of ${st.totalQ} questions</div></div>
<div class="metric-card"><div class="metric-label">In progress</div><div class="metric-val">${st.inProg}</div><div class="metric-sub">active items</div></div>
<div class="metric-card"><div class="metric-label">Sections</div><div class="metric-val">${SECTIONS.length}</div><div class="metric-sub">across 4 phases</div></div></div>
<div class="dash-phases">${pc}</div>
<div class="dash-table"><div class="dash-table-header"><h3>All sections overview</h3></div>${rows}</div></div>`;
}

window._create=createProject;
window._open=openProject;
window._del=deleteProject;
window._dup=duplicateProject;
window._back=async function(){if(S.saveTimer){clearTimeout(S.saveTimer);S.saveTimer=null;await saveProject();}S.screen="projects";loadProjects();};
window._phase=function(p){const secs=SECTIONS.filter(s=>s.phase===p);S.activePhase=p;S.activeSection=secs[0]?.id||S.activeSection;render();};
window._sec=function(sid){S.activeSection=sid;render();};
window._toggleView=function(){S.view=S.view==="dashboard"?"workspace":"dashboard";render();};
window._meta=function(f,v){S.meta[f]=v;debounceSave();};
window._resp=function(qid,v){if(!S.data[qid])S.data[qid]={response:"",status:"not-started"};S.data[qid].response=v;debounceSave();};
window._status=function(qid){if(!S.data[qid])S.data[qid]={response:"",status:"not-started"};const i=STATUSES.indexOf(S.data[qid].status||"not-started");S.data[qid].status=STATUSES[(i+1)%STATUSES.length];saveProject();render();};
window._tip=function(qid){S.openTips[qid]=!S.openTips[qid];render();};
window._exportMd=exportMarkdown;

loadProjects();
})();
</script>
