# Free credential-path check against a local Ollama model.
#
# WHAT THIS IS GOOD FOR: proving the gateway path end to end, credential
# detection, the CLI spawn, Anthropic-format routing through LiteLLM, and a real
# model reply. If this works, ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN are
# wired correctly.
#
# TIMING, measured on an M-series MacBook Air with qwen3.5-agent (6.6 GB):
# the first call pays ~5m30s to load the model into memory; once warm, a
# one-turn probe is ~11s. Real agent turns carry ~6K of system prompt plus
# tool results, so they run slower than that, budget generously and keep
# Ollama warm between runs.
#
# WHAT IS UNVALIDATED: whether a local model drives the pipeline correctly.
# The consultant agents call 8 typed tools per turn and recover poorly from
# mis-formatted calls. That is the real risk here, not speed. To validate the
# pipeline itself, use a hosted model, `claude-haiku-4-5` costs cents for
# `only intake`.
#
# This is also not a supported configuration; see the README's "Can I run this
# on GPT, Gemini, or a local model?" section for what breaks and why.
#
#   ollama serve
#   pip install 'litellm[proxy]'      # the bare litellm package can't serve
#   litellm --config examples/litellm-ollama.yaml --port 4000
#
# Then, in the shell you run EXCALIBUR from:
#
#   export ANTHROPIC_BASE_URL=http://localhost:4000
#   export ANTHROPIC_AUTH_TOKEN=sk-local-anything
#   export EXCALIBUR_MODEL=excalibur-local
#   export EXCALIBUR_EFFORT=none          # Ollama rejects Anthropic's effort param
#   export EXCALIBUR_THINKING=none        # ...and its adaptive-thinking param
#   export EXCALIBUR_PROBE_TIMEOUT=600    # the 90s default is far too short here
#
# Pick an agent-tuned model, the consultant agents call 8 typed tools per turn
# and general chat models mis-format them.

model_list:
  - model_name: excalibur-local
    litellm_params:
      model: ollama_chat/qwen3.5-agent:latest
      api_base: http://localhost:11434

  # Slower but stronger on multi-tool turns; swap the model_name above to use it.
  - model_name: excalibur-local-big
    litellm_params:
      model: ollama_chat/qwen3.5:35b-a3b
      api_base: http://localhost:11434

litellm_settings:
  drop_params: true   # silently discard Anthropic-only fields instead of 400ing
