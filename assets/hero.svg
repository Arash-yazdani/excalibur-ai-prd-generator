<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="AI PM EXCALIBUR landing page">
  <title>AI PM EXCALIBUR — Agentic PRD Generator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#0f1830"/>
      <stop offset="1" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7b0"/>
      <stop offset="0.46" stop-color="#e8c45e"/>
      <stop offset="0.54" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a9781f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6faff"/>
      <stop offset="0.49" stop-color="#bcc7d9"/>
      <stop offset="0.51" stop-color="#8d9bb2"/>
      <stop offset="1" stop-color="#5d6a82"/>
    </linearGradient>
    <radialGradient id="topglow" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#2a3a5c" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="win" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="ds" x="-30%" y="-80%" width="160%" height="260%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="winclip"><rect x="110" y="206" width="980" height="360" rx="14"/></clipPath>
    <style>
      .wm{font-family:Georgia,'Times New Roman',serif;font-weight:700;}
      .serif{font-family:Georgia,'Times New Roman',serif;}
      .sans{font-family:'Helvetica Neue',Arial,sans-serif;}
      .mono{font-family:'SF Mono','Courier New',monospace;}
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#topglow)"/>

  <!-- ===== brand lockup ===== -->
  <!-- sword -->
  <g filter="url(#ds)" transform="translate(0,4)">
    <rect x="430" y="49" width="20" height="20" rx="4" transform="rotate(45 440 59)" fill="url(#gold)"/>
    <rect x="449" y="53" width="44" height="12" rx="3" fill="#2a3142"/>
    <rect x="495" y="42" width="11" height="34" rx="4" fill="url(#gold)"/>
    <polygon points="508,53 740,57 766,59 740,61 508,65" fill="url(#steel)"/>
    <line x1="513" y1="59" x2="744" y2="59" stroke="#5d6a82" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <text class="wm" x="600" y="142" text-anchor="middle" font-size="62" letter-spacing="7" fill="#05080f" opacity="0.5" transform="translate(2,3)">EXCALIBUR</text>
  <text class="wm" x="600" y="142" text-anchor="middle" font-size="62" letter-spacing="7" fill="url(#gold)">EXCALIBUR</text>
  <text class="sans" x="600" y="170" text-anchor="middle" font-size="15" letter-spacing="7" font-weight="600" fill="#9fb0cc">AGENTIC PRD GENERATOR</text>
  <text class="serif" x="600" y="198" text-anchor="middle" font-size="17" fill="#c3cfe4">Paste a paragraph of product context — get a stakeholder-ready PRD, authored by six specialist AI agents.</text>

  <!-- ===== landing-page browser mockup ===== -->
  <rect x="110" y="206" width="980" height="360" rx="14" fill="#0d1426" stroke="#d4af37" stroke-opacity="0.16" filter="url(#win)"/>
  <g clip-path="url(#winclip)">
    <!-- title bar -->
    <rect x="110" y="206" width="980" height="38" fill="#1b2540"/>
    <circle cx="140" cy="225" r="6" fill="#ff5f57"/>
    <circle cx="160" cy="225" r="6" fill="#febc2e"/>
    <circle cx="180" cy="225" r="6" fill="#28c840"/>
    <rect x="470" y="217" width="260" height="17" rx="8" fill="#0a1020" stroke="#2a3a5c"/>
    <text class="mono" x="600" y="229" text-anchor="middle" font-size="11" fill="#7f8eaa">localhost:4500</text>

    <!-- app header (navy) -->
    <rect x="110" y="244" width="980" height="64" fill="#0f172a"/>
    <rect x="148" y="266" width="13" height="13" rx="3" transform="rotate(45 154.5 272.5)" fill="url(#gold)"/>
    <rect x="170" y="270" width="26" height="6" rx="2" fill="url(#steel)"/>
    <text class="wm" x="206" y="284" font-size="24" letter-spacing="2" fill="url(#gold)">EXCALIBUR</text>
    <rect x="905" y="262" width="150" height="34" rx="8" fill="#2563eb"/>
    <text class="sans" x="980" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">+ New project</text>

    <!-- body (slate) -->
    <rect x="110" y="308" width="980" height="258" fill="#eef2f8"/>
    <text class="serif" x="150" y="344" font-size="18" font-weight="700" fill="#334155">Projects</text>
    <text class="mono" x="1050" y="343" text-anchor="end" font-size="12" fill="#64748b">5 projects</text>

    <!-- card 1: complete -->
    <rect x="150" y="356" width="290" height="94" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="serif" x="168" y="388" font-size="15" font-weight="600" fill="#1e293b">Support Copilot</text>
    <rect x="356" y="368" width="68" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text class="sans" x="390" y="382" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">complete</text>
    <rect x="168" y="420" width="210" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="168" y="420" width="210" height="6" rx="3" fill="#1d4ed8"/>
    <text class="mono" x="424" y="426" text-anchor="end" font-size="11" fill="#64748b">100%</text>

    <!-- card 2: running -->
    <rect x="460" y="356" width="290" height="94" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="serif" x="478" y="388" font-size="15" font-weight="600" fill="#1e293b">Inventory Forecast Tool</text>
    <rect x="676" y="368" width="58" height="20" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text class="sans" x="705" y="382" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">running</text>
    <rect x="478" y="420" width="210" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="478" y="420" width="143" height="6" rx="3" fill="#1d4ed8"/>
    <text class="mono" x="734" y="426" text-anchor="end" font-size="11" fill="#64748b">68%</text>

    <!-- card 3: running -->
    <rect x="770" y="356" width="290" height="94" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="serif" x="788" y="388" font-size="15" font-weight="600" fill="#1e293b">Onboarding Assistant</text>
    <rect x="986" y="368" width="58" height="20" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text class="sans" x="1015" y="382" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">running</text>
    <rect x="788" y="420" width="210" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="788" y="420" width="86" height="6" rx="3" fill="#1d4ed8"/>
    <text class="mono" x="1044" y="426" text-anchor="end" font-size="11" fill="#64748b">41%</text>

    <!-- card 4: complete -->
    <rect x="150" y="460" width="290" height="94" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="serif" x="168" y="492" font-size="15" font-weight="600" fill="#1e293b">Analytics Dashboard</text>
    <rect x="356" y="472" width="68" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text class="sans" x="390" y="486" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">complete</text>
    <rect x="168" y="524" width="210" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="168" y="524" width="210" height="6" rx="3" fill="#1d4ed8"/>
    <text class="mono" x="424" y="530" text-anchor="end" font-size="11" fill="#64748b">100%</text>

    <!-- card 5: idle -->
    <rect x="460" y="460" width="290" height="94" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="serif" x="478" y="492" font-size="15" font-weight="600" fill="#1e293b">Meeting Notes AI</text>
    <rect x="690" y="472" width="44" height="20" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="sans" x="712" y="486" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">idle</text>
    <rect x="478" y="524" width="210" height="6" rx="3" fill="#e2e8f0"/>
    <text class="mono" x="734" y="530" text-anchor="end" font-size="11" fill="#94a3b8">0%</text>

    <!-- new project card (dashed) -->
    <rect x="770" y="460" width="290" height="94" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
    <text class="sans" x="915" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">+ New project</text>
    <text class="sans" x="915" y="520" text-anchor="middle" font-size="11" fill="#94a3b8">paste context to begin</text>
  </g>

  <!-- ===== pipeline ribbon ===== -->
  <text class="mono" x="600" y="602" text-anchor="middle" font-size="13" letter-spacing="0.5" fill="#9fb0cc">Intake<tspan fill="#d4af37">  &#8594;  </tspan>Discovery<tspan fill="#d4af37">  &#8594;  </tspan>Design<tspan fill="#d4af37">  &#8594;  </tspan>Develop<tspan fill="#d4af37">  &#8594;  </tspan>Deploy<tspan fill="#d4af37">  &#8594;  </tspan>PM Review</text>
</svg>
