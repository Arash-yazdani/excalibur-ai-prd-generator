<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-label="EXCALIBUR — Agentic PRD Generator">
  <title>AI PM EXCALIBUR</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c34"/>
      <stop offset="1" stop-color="#0a1122"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7b0"/>
      <stop offset="0.46" stop-color="#e8c45e"/>
      <stop offset="0.54" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a9781f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6faff"/>
      <stop offset="0.49" stop-color="#bcc7d9"/>
      <stop offset="0.51" stop-color="#8d9bb2"/>
      <stop offset="1" stop-color="#5d6a82"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.66" r="0.62">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-60%" width="140%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .wm{font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:10px;}
      .sub{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:600;letter-spacing:8px;}
    </style>
  </defs>

  <!-- panel -->
  <rect x="2" y="2" width="856" height="316" rx="26" fill="url(#panel)" stroke="#d4af37" stroke-opacity="0.18"/>
  <rect x="2" y="2" width="856" height="316" rx="26" fill="url(#glow)"/>

  <!-- sword across the top (pointing right) -->
  <g filter="url(#ds)">
    <!-- pommel -->
    <rect x="146" y="92" width="26" height="26" rx="5" transform="rotate(45 159 105)" fill="url(#gold)" stroke="#7e5a16" stroke-opacity="0.5"/>
    <!-- grip -->
    <rect x="170" y="97" width="64" height="16" rx="4" fill="#2a3142"/>
    <line x1="184" y1="97" x2="184" y2="113" stroke="#0d1220" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="198" y1="97" x2="198" y2="113" stroke="#0d1220" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="212" y1="97" x2="212" y2="113" stroke="#0d1220" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="226" y1="97" x2="226" y2="113" stroke="#0d1220" stroke-width="2" stroke-opacity="0.7"/>
    <!-- crossguard -->
    <rect x="236" y="80" width="13" height="50" rx="5" fill="url(#gold)" stroke="#7e5a16" stroke-opacity="0.5"/>
    <circle cx="242" cy="105" r="4" fill="#e0556b"/>
    <!-- blade -->
    <polygon points="252,95 690,101 726,105 690,109 252,115" fill="url(#steel)"/>
    <line x1="258" y1="105" x2="704" y2="105" stroke="#5d6a82" stroke-width="1.4" stroke-opacity="0.55"/>
    <line x1="258" y1="100.5" x2="694" y2="101.5" stroke="#f4f8ff" stroke-width="1" stroke-opacity="0.65"/>
    <!-- glint -->
    <path d="M566,105 l9,-3 -3,3 3,3 -9,-3 -9,3 3,-3 -3,-3 z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- wordmark -->
  <text class="wm" x="435" y="232" text-anchor="middle" font-size="90" fill="#05080f" opacity="0.55" transform="translate(2,3)">EXCALIBUR</text>
  <text class="wm" x="435" y="232" text-anchor="middle" font-size="90" fill="url(#gold)" stroke="#7e5a16" stroke-opacity="0.25" stroke-width="0.6">EXCALIBUR</text>

  <!-- subtitle with flanking rules -->
  <line x1="232" y1="270" x2="318" y2="270" stroke="#d4af37" stroke-opacity="0.45"/>
  <line x1="552" y1="270" x2="638" y2="270" stroke="#d4af37" stroke-opacity="0.45"/>
  <text class="sub" x="435" y="276" text-anchor="middle" font-size="19" fill="#9fb0cc">AGENTIC PRD GENERATOR</text>
</svg>
